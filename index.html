:root{
  --paper:#EDE6D3;
  --paper-dark:#E2D8BE;
  --ink:#18140F;
  --red:#C8291E;
  --yellow:#E7B428;
  --line:rgba(24,20,15,0.14);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--ink);
  font-family:'Courier New', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  min-height:100vh;
  overflow-x:hidden;
}

/* subtle halftone texture on the dark app shell */
.shell{
  min-height:100vh;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1.3px);
  background-size:6px 6px;
}

.paper{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(24,20,15,0.025) 0px, rgba(24,20,15,0.025) 1px, transparent 1px, transparent 3px);
  min-height:100vh;
  position:relative;
}

/* ===== HEADER ===== */
header.top{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--ink);
  color:var(--paper);
  padding:16px 16px 14px;
  border-bottom:4px solid var(--red);
}
header.top .brand{
  font-family:'Troublemarker', sans-serif;
  font-size:30px;
  letter-spacing:1px;
  line-height:0.9;
  transform:rotate(-1.5deg);
  display:inline-block;
  color:var(--paper);
  text-shadow:2px 2px 0 var(--red);
}
header.top .brand small{
  display:block;
  font-family:'Courier New', monospace;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--yellow);
  margin-top:4px;
  text-shadow:none;
}
.crumbrow{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}
.backbtn{
  background:var(--yellow);
  color:var(--ink);
  border:none;
  font-family:'Courier New', monospace;
  font-weight:700;
  font-size:14px;
  padding:8px 12px;
  border-radius:0;
  transform:skewX(-8deg);
  cursor:pointer;
}
.backbtn span{display:inline-block;transform:skewX(8deg);}
.crumb-label{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--paper-dark);
  opacity:0.8;
}

/* ===== SEARCH ===== */
.searchwrap{padding:14px 16px 0;}
.searchbox{
  width:100%;
  padding:12px 14px;
  font-family:'Courier New', monospace;
  font-size:15px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  outline:none;
}
.searchbox::placeholder{color:#8a8270;}

/* ===== LIST ===== */
main{padding:14px 16px 60px;}
.count-tag{
  display:inline-block;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--ink);
  opacity:0.55;
  margin:14px 0 8px 2px;
}

.card{
  display:block;
  width:100%;
  text-align:left;
  background:#fff;
  border:none;
  border-left:6px solid var(--red);
  padding:14px 14px;
  margin-bottom:10px;
  font-family:inherit;
  cursor:pointer;
  position:relative;
  box-shadow:3px 3px 0 rgba(24,20,15,0.12);
}
.card:nth-child(3n+1){border-left-color:var(--red);}
.card:nth-child(3n+2){border-left-color:var(--yellow);}
.card:nth-child(3n){border-left-color:var(--ink);}
.card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(24,20,15,0.12);}

.card .name{
  font-family:'Troublemarker', sans-serif;
  font-size:22px;
  line-height:1.18;
  letter-spacing:0.5px;
}
.card .meta{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#5c5546;
  margin-top:6px;
}
.card .album{
  font-size:11px;
  color:#8a8270;
  margin-top:3px;
}

.empty{
  padding:40px 10px;
  text-align:center;
  color:#5c5546;
  font-size:14px;
  line-height:1.6;
}
.empty b{display:block;font-family:'Troublemarker',sans-serif;font-size:22px;color:var(--ink);margin-bottom:6px;}

/* ===== SONG PAGE ===== */
.songpage{padding:0 0 60px;}
 .songhead{
  padding:18px 16px 16px;
  background:var(--paper-dark);
  border-bottom:3px dashed var(--ink);
  position:relative;
}
.songhead, .chordsbox, .songbody{ text-transform:uppercase; }
.songhead .stitle{
  font-family:'Troublemarker', sans-serif;
  font-size:30px;
  line-height:1.08;
  transform:rotate(-1deg);
  display:block;
}
.songhead .sartist{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:10px;
  color:var(--ink);
  opacity:0.7;
}
.pill{
  display:inline-block;
  margin-top:8px;
  background:var(--red);
  color:var(--paper);
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:4px 10px;
}
.chordsbox{
  margin:0;
  padding:12px 16px 13px;
  background:#eee7d5;
  border-bottom:2px solid var(--ink);
}
.section-label{
  display:block;
  font-family:'Troublemarker', sans-serif;
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:6px;
}
.chords-text{
  font-family:'Troublemarker', 'Courier New', monospace;
  font-size:15px;
  line-height:1.35;
  letter-spacing:.3px;
  color:var(--ink);
  font-weight:400;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.songbody{
  padding:16px 16px 90px;
  white-space:pre-wrap;
  word-wrap:break-word;
  font-family:'Troublemarker', 'Courier New', monospace;
  font-size:10.5px;
  letter-spacing:0.05px;
  line-height:1.08;
  color:var(--ink);
}
.songbody .section{
  display:block;
  color:var(--ink);
  margin-top:12px;
}
.songbody .section:first-child{margin-top:0;}
.songbody .section-title{
  display:block;
  color:var(--red);
  font-family:'Troublemarker', sans-serif;
  font-size:11.5px;
  margin:0;
}
.songbody .section-text{
  display:block;
  color:var(--ink);
  margin:0;
  padding:0;
  white-space:pre-line;
  line-height:1.08;
}
.autoscroll{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:7px;
  background:#171410;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 rgba(24,20,15,.25);
}
.autoscroll .scroll-label{
  color:var(--paper);
  font:10px 'Courier New',monospace;
  letter-spacing:1px;
  margin-right:3px;
}
.speedbtn{
  border:1px solid #6e6759;
  background:#29241d;
  color:var(--paper);
  min-width:42px;
  height:30px;
  padding:0 7px;
  font:11px 'Courier New',monospace;
  cursor:pointer;
}
.speedbtn.active{
  background:var(--red);
  border-color:var(--red);
}
.speedbtn:active{transform:translate(1px,1px);}
@media (min-width:640px){
  .autoscroll{left:50%;right:auto;transform:translateX(-50%);width:620px;}
}
footer.credit{
  text-align:center;
  padding:18px 10px 26px;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#8a8270;
}

@media (min-width:640px){
  main{max-width:640px;margin:0 auto;}
  header.top{padding-left:calc(50% - 320px + 16px);padding-right:calc(50% - 320px + 16px);}
  .songhead,.songbody{max-width:640px;margin:0 auto;}
}
</style>
</head>
<body>
<div class="shell">
  <div class="paper" id="app"></div>
</div>

<script>
// ==== NASTAVENIE ====
// songs.json je v tom istom repe/priečinku ako index.html, takže stačí relatívna cesta.
// (ak by si dáta chcel mať v samostatnom gist-e, daj sem jeho "Raw" URL namiesto "songs.json")
const GIST_URL = "songs.json";
// =====================

const CACHE_KEY = 'punk-spevnik-data-v1';
const app = document.getElementById('app');
let ARTISTS = [];

function showLoading(){
  app.innerHTML = `
    <header class="top">
      <span class="brand">PUNK<br>SPEVNÍK<small>texty &amp; akordy</small></span>
    </header>
    <main><div class="empty"><b>Načítavam…</b>Sťahujem pesničky z gistu.</div></main>
  `;
}

function showError(){
  app.innerHTML = `
    <header class="top">
      <span class="brand">PUNK<br>SPEVNÍK<small>texty &amp; akordy</small></span>
    </header>
    <main><div class="empty"><b>Nepodarilo sa načítať dáta</b>Skontroluj pripojenie na internet, alebo či je správne nastavená GIST_URL v kóde appky.</div></main>
  `;
}

async function loadData(){
  showLoading();
  // 1. skús cache, nech je appka rýchla aj offline
  const cached = localStorage.getItem(CACHE_KEY);
  if(cached){
    try{ ARTISTS = JSON.parse(cached); render(); }catch(e){}
  }
  // 2. skús stiahnuť čerstvé dáta z gistu (cache-bust, aby GitHub nevracal starú verziu)
  try{
    const res = await fetch(GIST_URL + (GIST_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    if(!res.ok) throw new Error('fetch failed');
    const fresh = await res.json();
    ARTISTS = fresh;
    localStorage.setItem(CACHE_KEY, JSON.stringify(fresh));
    render();
  }catch(e){
    if(!cached){ showError(); }
    // ak cache existovala, appka už beží zo starších dát, len ticho zlyhá refresh
  }
}

function norm(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// Rozdelí text na samostatné akordy a samotný text pesničky.
function parseSongBody(text){
  const raw = (text || '').replace(/\r/g,'').split('\n');
  const chordLine = /^\s*(sloha|refr[ée]n|predrefr[ée]n|medzihra|intro|outro|bridge|po refr[ée]ne)[^:]{0,18}:\s*(.*)$/i;
  const chords = [];
  const body = [];

  raw.forEach(line => {
    const trimmed = line.trim();
    const match = trimmed.match(chordLine);
    if(match){
      const after = match[2].trim();
      // Ak je za názvom časti iba akordová postupnosť, presunieme celý riadok do AKORDY.
      const chordish = after &&
        /[A-Ga-g][#b♭]?/.test(after) &&
        !/[a-zá-ž]{4,}\s+[a-zá-ž]{4,}/i.test(after) &&
        /^[A-Ga-g#b♭mM0-9()\-–—/\s.,x×]+$/.test(after);
      if(chordish){
        chords.push(trimmed);
        return;
      }
    }
    body.push(line.replace(/^\s+/, ''));
  });

  return {chords, body};
}

function renderBody(text){
  const parsed = parseSongBody(text);
  const sectionRe = /^\s*(sloha|refr[ée]n|predrefr[ée]n|medzihra|intro|outro|bridge|po refr[ée]ne)(?:\s*\d+)?\s*:\s*(.*)$/i;
  const sections = [];
  let current = null;
  const loose = [];

  parsed.body.forEach(line => {
    const trimmed = line.trim();
    if(!trimmed) return; // odstráni prázdne riadky medzi veršami

    const m = trimmed.match(sectionRe);
    if(m){
      if(current) sections.push(current);
      current = { title: trimmed.slice(0, trimmed.indexOf(':') + 1).trim(), lines: [] };
      if(m[2].trim()) current.lines.push(m[2].trim().toUpperCase());
      return;
    }

    if(current) current.lines.push(trimmed.toUpperCase());
    else loose.push(trimmed.toUpperCase());
  });
  if(current) sections.push(current);

  let bodyHtml = '';
  sections.forEach(section => {
    bodyHtml += `<div class="section"><span class="section-title">${escapeHtml(section.title.toUpperCase())}</span>`;
    if(section.lines.length){
      bodyHtml += `<div class="section-text">${escapeHtml(section.lines.join('\n'))}</div>`;
    }
    bodyHtml += `</div>`;
  });
  if(loose.length) bodyHtml += `<div class="loose-text">${escapeHtml(loose.join('\n'))}</div>`;

  const chordsHtml = parsed.chords.length
    ? `<div class="chordsbox"><span class="section-label">AKORDY</span><div class="chords-text">${escapeHtml(parsed.chords.join('\n').toUpperCase())}</div></div>`
    : '';

  return {chordsHtml, bodyHtml};
}

// 0 = stojí, 1 = pomaly, 2 = rýchlejšie.
const SCROLL_SPEEDS = [0, 8, 18];
let scrollSpeed = 0;
let scrollFrame = null;
let lastScrollTime = 0;

function stopAutoScroll(){
  if(scrollFrame) cancelAnimationFrame(scrollFrame);
  scrollFrame = null;
  lastScrollTime = 0;
}

function startAutoScroll(){
  stopAutoScroll();
  if(scrollSpeed === 0) return;

  const tick = (now) => {
    if(scrollSpeed === 0) return;
    if(!lastScrollTime) lastScrollTime = now;
    const dt = Math.min(now - lastScrollTime, 50);
    lastScrollTime = now;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if(window.scrollY >= max - 1){
      stopAutoScroll();
      return;
    }
    window.scrollBy(0, SCROLL_SPEEDS[scrollSpeed] * dt / 1000);
    scrollFrame = requestAnimationFrame(tick);
  };
  scrollFrame = requestAnimationFrame(tick);
}

function setScrollSpeed(value){
  scrollSpeed = Number(value);
  document.querySelectorAll('.speedbtn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.speed) === scrollSpeed);
  });
  if(scrollSpeed === 0) stopAutoScroll();
  else startAutoScroll();
}

function routeParts(){
  const h = location.hash.replace(/^#\/?/, '');
  return h.split('/').filter(Boolean).map(decodeURIComponent);
}

function go(hash){ location.hash = hash; }

function render(){
  stopAutoScroll();
  const parts = routeParts();
  window.scrollTo(0,0);
  if(parts[0] === 'a' && parts[1] !== undefined){
    const artist = ARTISTS[parts[1]];
    if(parts[2] !== undefined && artist){
      renderSong(artist, parts[1], parts[2]);
      return;
    }
    if(artist){ renderArtist(artist, parts[1]); return; }
  }
  renderHome();
}

function renderHome(q){
  const query = q !== undefined ? q : '';
  const allArtists = ARTISTS.map((a,i)=>({a,i})).sort((x,y) =>
    x.a.name.localeCompare(y.a.name, 'sk', {sensitivity:'base'})
  );
  const filtered = query
    ? allArtists.filter(({a}) => norm(a.name).includes(norm(query)) ||
        a.songs.some(s => norm(s.title).includes(norm(query))))
    : allArtists;

  let html = `
    <header class="top">
      <span class="brand">PUNK<br>SPEVNÍK<small>texty &amp; akordy</small></span>
    </header>
    <div class="searchwrap">
      <input class="searchbox" id="search" type="text" placeholder="Hľadať kapelu alebo pesničku…" value="${escapeHtml(query)}">
    </div>
    <main>
      <div class="count-tag">${ARTISTS.length} interpretov · ${ARTISTS.reduce((n,a)=>n+a.songs.length,0)} pesničiek</div>
  `;

  if(filtered.length === 0){
    html += `<div class="empty"><b>Nič sa nenašlo</b>Skús iné slovo.</div>`;
  } else {
    filtered.forEach(({a,i}) => {
      html += `<button class="card" data-goto="#/a/${i}">
        <span class="name">${escapeHtml(a.name)}</span>
        <div class="meta">${a.songs.length} pesnič${a.songs.length===1?'ka':(a.songs.length<5?'ky':'iek')}</div>
      </button>`;
    });
  }
  html += `</main><footer class="credit">Furmanka · offline songbook</footer>`;
  app.innerHTML = html;

  const search = document.getElementById('search');
  search.addEventListener('input', e => renderHome(e.target.value));
  search.focus({preventScroll:true});
  if(query){ search.setSelectionRange(query.length, query.length); }
  bindCardClicks();
}

function renderArtist(artist, idx){
  let html = `
    <header class="top">
      <div class="crumbrow">
        <button class="backbtn" data-goto="#/"><span>&larr; SPÄŤ</span></button>
        <span class="crumb-label">interpret</span>
      </div>
      <span class="brand" style="margin-top:12px;">${escapeHtml(artist.name)}</span>
    </header>
    <main>
      <div class="count-tag">${artist.songs.length} pesnič${artist.songs.length===1?'ka':(artist.songs.length<5?'ky':'iek')}</div>
  `;
  artist.songs.forEach((s,i) => {
    html += `<button class="card" data-goto="#/a/${idx}/${i}">
      <span class="name">${escapeHtml(s.title)}</span>
      ${s.album ? `<div class="album">${escapeHtml(s.album)}</div>` : ''}
    </button>`;
  });
  html += `</main><footer class="credit">Furmanka · offline songbook</footer>`;
  app.innerHTML = html;
  bindCardClicks();
}

function renderSong(artist, aIdx, sIdx){
  const song = artist.songs[sIdx];
  let html = `
    <header class="top">
      <div class="crumbrow">
        <button class="backbtn" data-goto="#/a/${aIdx}"><span>&larr; SPÄŤ</span></button>
        <span class="crumb-label">${escapeHtml(artist.name)}</span>
      </div>
    </header>
    <div class="songpage">
      <div class="songhead">
        <span class="stitle">${escapeHtml(song.title)}</span>
        ${song.album ? `<span class="pill">${escapeHtml(song.album)}</span>` : ''}
      </div>
      ${renderBody(song.body).chordsHtml}
      <div class="songbody">${renderBody(song.body).bodyHtml}</div>
      <div class="autoscroll" aria-label="Automatické posúvanie textu">
        <span class="scroll-label">POSUN</span>
        <button class="speedbtn active" data-speed="0" onclick="setScrollSpeed(0)">0</button>
        <button class="speedbtn" data-speed="1" onclick="setScrollSpeed(1)">1</button>
        <button class="speedbtn" data-speed="2" onclick="setScrollSpeed(2)">2</button>
      </div>
    </div>
  `;
  app.innerHTML = html;
  bindCardClicks();
}

function bindCardClicks(){
  app.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => go(el.getAttribute('data-goto')));
  });
}

window.addEventListener('hashchange', render);

// PWA / offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
loadData();
</script>
</body>
</html>
